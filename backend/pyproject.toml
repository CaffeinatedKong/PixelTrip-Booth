[project]
name = "pixelart-trip-planner-backend"
version = "0.1.0"
description = "FastAPI backend placeholder for PixelArt Trip Planner (Foundation scaffolding)."
requires-python = ">=3.11"

# Runtime dependencies. LangGraph / AI / external-API deps are intentionally
# EXCLUDED at the Foundation stage (Requirement 10.3).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "supabase>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # used by fastapi TestClient for the /health smoke test
    "ruff>=0.4",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# --- Tooling configuration ---
# Ruff (lint/format) config lives in the dedicated ./ruff.toml at the backend root.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
