# Ruff configuration for the PixelArt Trip Planner backend.
# Dedicated tooling config at the backend root (Requirement 4.1).

line-length = 100
target-version = "py311"
src = ["app", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
# `src` points inside the package, so name it explicitly to keep app imports grouped
# after third-party imports.
known-first-party = ["app"]
